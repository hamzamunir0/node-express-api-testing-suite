name: CI - Newman API Testing Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. This spins up an actual MongoDB database engine automatically
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Install Newman
        run: npm install -g newman

      - name: Start backend server with Environment Variables
        # 2. This injects the variables directly into the server memory (No .env file needed)
        env:
          PORT: 4000
          MONGO_URI: mongodb://localhost:27017/test_automation_db
          SECRET: local_testing_secret_key_123
        run: |
          cd backend
          npm start &

      - name: Wait for server to start
        run: sleep 5

      - name: Run Newman tests
        run: newman run collection.json -e environment.json